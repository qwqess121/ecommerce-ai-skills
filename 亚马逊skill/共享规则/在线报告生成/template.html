<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>
/* 布局与区块结构按参考报告 Xk3D；颜色体系沿用 Vy3j（浅色 / 深色）。 */
:root{
  --bg:#f6f5f2; --fg:#1d1d24; --muted:#5b5f6b; --card:#ffffff; --line:#dcd9d2;
  --accent:#4b3fa6; --amber:#b7791f; --amber-bg:#fdf3dc; --green:#2f7d5b; --green-bg:#e4f3ec;
  --blue-bg:#e8edf7; --red:#b4432b; --red-bg:#fbe9e4; --prompt-bg:#f1eefb; --mono:ui-monospace,Menlo,Consolas,monospace;
  --summary-bg:#eef0fd; --summary-border:#4f5fd6; --summary-text:#2f3a9e;
  --finding-bg:#fdf5e6; --finding-border:#d9a237; --finding-text:#6b4a0f;
  --table-bg:#eef6f1; --table-border:#4a9a7d; --table-text:#1a5541;
  --warning-bg:#fef0eb; --warning-border:#d97060; --warning-text:#7a3a28;
  --info-bg:#f0f3f7; --info-border:#7a8fa8; --info-text:#3a4558;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15161c; --fg:#e9e8ee; --muted:#a4a7b3; --card:#1e2029; --line:#34374a;
    --accent:#a99cf0; --amber:#e8b25b; --amber-bg:#3a2f18; --green:#7cc7a1; --green-bg:#1c3a2c;
    --blue-bg:#1f2540; --red:#f0907a; --red-bg:#3f221c; --prompt-bg:#25233a;
    --summary-bg:rgba(124,138,255,.13); --summary-border:#8f9dff; --summary-text:#c7cdff;
    --finding-bg:rgba(217,162,55,.14); --finding-border:#e8b868; --finding-text:#f0d495;
    --table-bg:rgba(74,154,125,.16); --table-border:#7ec5aa; --table-text:#a8e0c8;
    --warning-bg:rgba(217,112,96,.16); --warning-border:#ef9882; --warning-text:#f0b0a0;
    --info-bg:rgba(122,143,168,.16); --info-border:#a8c0e0; --info-text:#c8daf5;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15161c; --fg:#e9e8ee; --muted:#a4a7b3; --card:#1e2029; --line:#34374a;
  --accent:#a99cf0; --amber:#e8b25b; --amber-bg:#3a2f18; --green:#7cc7a1; --green-bg:#1c3a2c;
  --blue-bg:#1f2540; --red:#f0907a; --red-bg:#3f221c; --prompt-bg:#25233a;
  --summary-bg:rgba(124,138,255,.13); --summary-border:#8f9dff; --summary-text:#c7cdff;
  --finding-bg:rgba(217,162,55,.14); --finding-border:#e8b868; --finding-text:#f0d495;
  --table-bg:rgba(74,154,125,.16); --table-border:#7ec5aa; --table-text:#a8e0c8;
  --warning-bg:rgba(217,112,96,.16); --warning-border:#ef9882; --warning-text:#f0b0a0;
  --info-bg:rgba(122,143,168,.16); --info-border:#a8c0e0; --info-text:#c8daf5;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.7 "Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;padding:0 16px}
.wrap{max-width:1600px;margin:0 auto;display:grid;grid-template-columns:250px minmax(0,1fr);gap:32px;padding-block:24px 48px}
nav.index{position:sticky;top:16px;align-self:start;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 12px}
nav.index .brand{font-size:12px;letter-spacing:.06em;color:var(--accent);font-weight:700;margin:0 0 2px}
nav.index .brand-sub{font-size:12px;color:var(--muted);margin:0 0 10px;line-height:1.5}
nav.index h4{margin:8px 0 8px;font-size:13px;color:var(--muted)}
nav.index a{display:block;padding:7px 10px;font-size:14px;border-radius:6px;color:var(--fg);text-decoration:none}
nav.index a:hover{background:var(--blue-bg)}
nav.index a.current{background:var(--blue-bg);box-shadow:inset 3px 0 0 var(--accent);font-weight:600}
.theme{display:flex;gap:4px;margin-top:12px;padding:4px;background:var(--blue-bg);border-radius:6px}
.theme button{flex:1;border:none;background:none;padding:6px 4px;border-radius:4px;cursor:pointer;font-size:12px;color:var(--muted)}
.theme button.active{background:var(--card);color:var(--accent);font-weight:700}
main{min-width:0}
h1{font-family:Georgia,"Noto Serif SC","Songti SC",serif;font-size:28px;line-height:1.3;margin:8px 0 14px;text-wrap:balance}
h2{font-family:Georgia,"Noto Serif SC","Songti SC",serif;font-size:22px;line-height:1.4;margin:32px 0 12px;padding-top:8px;border-top:1px solid var(--line);text-wrap:balance;scroll-margin-top:12px}
h3{font-size:18px;margin:20px 0 8px;color:var(--accent)}
h4{font-size:16px;margin:14px 0 6px}
p{margin:10px 0;font-size:15px;line-height:1.85}
li{font-size:15px;line-height:1.75}
ul li{margin:4px 0}
a.asin,a.asin-link{color:var(--accent);text-decoration:underline;text-underline-offset:3px;text-decoration-style:dotted;white-space:nowrap}
a.asin:hover,a.asin-link:hover{text-decoration-style:solid}
a.asin::after,a.asin-link::after{content:'\2197';font-size:.85em;margin-left:2px;opacity:.6}
/* KPI 网格：容器 .kpi-grid，内含 .kpi（.kpi-label 标签 + .kpi-value 数值）。写法见 references/报告格式规范.md 3.2 */
.kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:22px 0 32px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0;transition:border-color .2s ease,box-shadow .2s ease}
.kpi:hover{border-color:var(--accent);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.kpi-label{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.02em}
.kpi-value{font-size:18px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.35;overflow-wrap:anywhere}
/* 模块卡片网格：容器 .mod-grid，内含 a.modcard（.modcard-num 编号、h3 标题、p 问题、.modcard-tag 标签）。写法见 references/报告格式规范.md 3.3 */
.mod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin:22px 0 34px}
a.modcard,.modcard{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-width:0;color:var(--fg);text-decoration:none;transition:border-color .2s ease,transform .2s ease,box-shadow .2s ease}
.modcard:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.modcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.modcard-num{font-size:13px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.04em}
.modcard h3{margin:0;font-size:16px;font-weight:700;color:var(--fg)}
.modcard p{font-size:13px;color:var(--muted);margin:0 0 8px;flex:1;line-height:1.6}
.modcard-tag{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;line-height:1.6}
.guide{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--info-border);border-radius:10px;padding:12px 14px;margin:12px 0 20px;font-size:13px;color:var(--muted);line-height:1.8}
.guide b{color:var(--fg)}
.tablewrap{overflow-x:auto;margin:8px 0 6px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:640px;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;font-size:14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;line-height:1.6}
th{background:var(--blue-bg);font-weight:600}
td.num{text-align:right}
.src{color:var(--muted);font-size:12px;margin:0 0 14px}
.summary-block{background:var(--summary-bg);border-left:4px solid var(--summary-border);border-radius:0 8px 8px 0;padding:12px 18px;margin:12px 0;color:var(--summary-text)}
.finding-block{background:var(--finding-bg);border-left:4px solid var(--finding-border);border-radius:0 8px 8px 0;padding:12px 18px;margin:12px 0;color:var(--finding-text)}
.warning-block{background:var(--warning-bg);border-left:4px solid var(--warning-border);border-radius:0 8px 8px 0;padding:12px 18px;margin:12px 0;color:var(--warning-text)}
.chip,.summary-label,.finding-label{display:inline-block;color:#fff;font-size:12px;font-weight:700;padding:2px 9px;border-radius:4px;margin-right:8px;vertical-align:2px;letter-spacing:.03em}
.chip-summary,.summary-label{background:#4a7fbf}
.chip-finding,.finding-label{background:#d9a237}
.chip-table{background:#4a9a7d}
.chip-warning{background:#d97060}
.chip-info{background:#7a8fa8}
.warning-label{display:inline-block;color:#fff;font-size:12px;font-weight:700;padding:2px 9px;border-radius:4px;margin-right:8px;vertical-align:2px;letter-spacing:.03em;background:#d97060}
.prompt{background:var(--prompt-bg);border:1px dashed var(--accent);border-radius:8px;padding:10px 12px;margin:10px 0;font:13px/1.6 var(--mono);white-space:pre-wrap;word-break:break-word}
.cmp-wrap table{table-layout:fixed;min-width:0}
.cmp-wrap th,.cmp-wrap td{white-space:normal;word-break:break-word;line-height:1.6}
.cmp-wrap tbody th{width:96px}
.pri{display:inline-block;font-size:12px;font-weight:700;color:#fff;padding:2px 9px;border-radius:4px;white-space:nowrap}
.pri-p0{background:#2d7a5c}.pri-p1{background:#4a7fbf}.pri-p2{background:#d9a237}.pri-p3{background:#7a8fa8}.pri-no{background:#d97060}
.toc-list{list-style:none;margin:12px 0 18px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:6px 8px;background:var(--card);border:1px solid var(--line);border-radius:8px}
.toc-list li{margin:0}
.toc-list a.toc-link{display:inline-block;font-size:12px;color:var(--muted);background:var(--blue-bg);border:1px solid var(--line);border-radius:4px;padding:5px 10px;text-decoration:none}
.toc-list a.toc-link:hover{border-color:var(--accent);color:var(--accent)}
.caveat-box{background:var(--warning-bg);border:1px solid var(--warning-border);border-radius:8px;padding:14px 16px;margin:16px 0}
section.page{display:block}
html.js section.page{display:none}
/* 无脚本时（静态预览、附件）所有模块同时显示：模块之间必须有明显分隔，不能首尾相接 */
html:not(.js) section.page + section.page{margin-top:72px;padding-top:44px;border-top:4px solid var(--accent)}
html.js section.page.active{display:block}
.pager{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:34px 0 0;padding-top:14px;border-top:1px solid var(--line);font-size:13px}
.pager a{color:var(--accent);border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--card);text-decoration:none;max-width:100%}
.pager a:hover{background:var(--blue-bg)}
.pager span{color:var(--muted)}
@media (max-width:820px){
  .wrap{grid-template-columns:minmax(0,1fr);gap:12px}
  nav.index{position:static;display:flex;flex-wrap:wrap;gap:4px;padding:8px}
  nav.index h4,nav.index .brand,nav.index .brand-sub,.theme{width:100%}
  nav.index a{padding:4px 8px;font-size:13px}
  .kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mod-grid{grid-template-columns:minmax(0,1fr)}
}
</style>
</head>
<body>
<div class="wrap">
<nav class="index" aria-label="目录">
  <p class="brand">{{BRAND_NAME}}</p>
  <p class="brand-sub">{{BRAND_SUB}}</p>
  <h4>目录</h4>
{{NAV}}
  <div class="theme" role="group" aria-label="主题">
    <button type="button" data-theme-choice="light">浅色</button>
    <button type="button" data-theme-choice="system" class="active">系统</button>
    <button type="button" data-theme-choice="dark">深色</button>
  </div>
</nav>
<main>
{{SECTIONS}}
</main>
</div>
<script>
(function(){
  // 无脚本环境（静态预览）下所有页面保持可见；脚本运行后才切换为单页显示
  document.documentElement.classList.add('js');
  var pages=[].slice.call(document.querySelectorAll('main > section.page'));
  var links=[].slice.call(document.querySelectorAll('nav.index a[href^="#"]'));
  function show(id,push){
    var target=null;
    pages.forEach(function(s){ if(s.id===id) target=s; });
    if(!target){ target=pages[0]; id=target.id; }
    pages.forEach(function(s){ s.classList.toggle('active', s===target); });
    links.forEach(function(a){ a.classList.toggle('current', a.getAttribute('href')==='#'+id); });
    window.scrollTo(0,0);
    if(push){ try{ history.replaceState(null,'','#'+id); }catch(e){} }
  }
  document.querySelectorAll('nav.index a[href^="#"], a[data-go]').forEach(function(a){
    a.addEventListener('click',function(e){
      e.preventDefault();
      var target=a.getAttribute('data-go')||a.getAttribute('href').replace(/^#/,'');
      show(target,true);
    });
  });
  // 本页目录：先切到所在模块，再滚动到目标标题（模块之间是互斥显示）
  document.querySelectorAll('.toc-link').forEach(function(a){
    a.addEventListener('click',function(e){
      e.preventDefault();
      show(a.getAttribute('data-module'),true);
      var el=document.getElementById(a.getAttribute('data-target'));
      if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
    });
  });
  window.addEventListener('hashchange',function(){ show((location.hash||'#m0').slice(1),false); });
  // 区块分类：段首加粗标签决定颜色（同一类标签在全部报告中颜色一致，见 README「颜色规则」）
  var BLOCK_RULES=[
    {re:/^小结/,            kind:'summary'},  // 蓝紫：整段小结
    {re:/发现/,             kind:'finding'},  // 琥珀：关键发现
    {re:/修正|限制|缺口|未完成|风险|警告/, kind:'warning'}  // 红橙：修正、限制、风险
  ];
  document.querySelectorAll('main > section.page blockquote, main > section.page p').forEach(function(el){
    if(el.tagName==='P' && el.closest('blockquote')) return;
    var target=el.tagName==='BLOCKQUOTE'?el.querySelector('p'):el;
    if(!target) return;
    var first=target.firstElementChild;
    if(!first || first.tagName!=='STRONG') return;
    var label=(first.textContent||'').trim();
    // 第一条命中的规则生效；顺序即优先级
    var rule=BLOCK_RULES.filter(function(r){ return r.re.test(label); })[0];
    if(rule){ el.classList.add(rule.kind+'-block'); first.classList.add(rule.kind+'-label'); }
  });
  // 主题切换
  function setTheme(choice){
    var root=document.documentElement;
    if(choice==='light') root.setAttribute('data-theme','light');
    else if(choice==='dark') root.setAttribute('data-theme','dark');
    else root.removeAttribute('data-theme');
    document.querySelectorAll('[data-theme-choice]').forEach(function(b){
      b.classList.toggle('active', b.getAttribute('data-theme-choice')===choice);
    });
    try{ localStorage.setItem('report-theme',choice); }catch(e){}
  }
  document.querySelectorAll('[data-theme-choice]').forEach(function(b){
    b.addEventListener('click',function(){ setTheme(b.getAttribute('data-theme-choice')); });
  });
  var saved='system';
  try{ saved=localStorage.getItem('report-theme')||'system'; }catch(e){}
  setTheme(saved);
  show((location.hash||'#m0').slice(1),false);
})();
</script>
</body>
</html>
